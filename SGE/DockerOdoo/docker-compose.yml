services:
  db:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    container_name: odoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_secure_local_dev_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-1.5}'
          memory: ${DB_MEMORY_LIMIT:-1024M}

  web:
    image: odoo:${ODOO_IMAGE_TAG:-17.0}
    container_name: odoo_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_HTTP_PORT:-8069}:8069"
      - "${ODOO_CHAT_PORT:-8072}:8072"
    environment:
      HOST: ${POSTGRES_HOST:-db}
      PORT: ${POSTGRES_PORT:-5432}
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_secure_local_dev_123}
    volumes:
      # Montaje de configuración como solo lectura (:ro) para mayor seguridad
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      # Montaje de módulos propios desarrollados
      - ./addons:/mnt/extra-addons
      # Persistencia de datos dinámicos (filestore, sesiones, adjuntos)
      - odoo-web-data:/var/lib/odoo
    networks:
      - odoo-network
    deploy:
      resources:
        limits:
          cpus: '${ODOO_CPU_LIMIT:-2.0}'
          memory: ${ODOO_MEMORY_LIMIT:-2048M}

networks:
  odoo-network:
    name: odoo_internal_network
    driver: bridge

volumes:
  odoo-db-data:
    name: odoo_db_data
  odoo-web-data:
    name: odoo_web_data
