# =====================================================================
# Configuración Override para Producción
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =====================================================================
services:
  db:
    restart: always

  web:
    restart: always
    # En producción activamos workers (ej. 5 workers para 2 núcleos de CPU)
    # y desactivamos el modo dev.
    command: >
      odoo
      --workers=5
      --max-cron-threads=1
    ports:
      # En producción es buena práctica vincular solo al localhost (127.0.0.1)
      # para ser gestionado por un proxy inverso (Nginx, Traefik o Caddy con SSL/HTTPS)
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_CHAT_PORT:-8072}:8072"
