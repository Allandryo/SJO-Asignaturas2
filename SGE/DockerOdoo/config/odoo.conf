[options]
; =====================================================================
; Configuración del Servidor Odoo
; =====================================================================

; Rutas de Addons (Módulos estándar y módulos propios montados)
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Conexión a Base de Datos PostgreSQL
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secure_local_dev_123
db_maxconn = 64
db_name = False

; Seguridad y Administración
; Contraseña maestra para crear, restaurar y respaldar bases de datos
admin_passwd = admin_dev_master_key_123
list_db = True

; Configuración de Multiproceso y Workers
; Nota: En desarrollo se usa workers = 0 para permitir hot-reload y depuración interactiva.
; En producción, calcular: (CPUs * 2) + 1 (ej: 2 CPUs -> 5 workers).
workers = 0
max_cron_threads = 1

; Límites de memoria y tiempo por worker (prevención de fugas y bloqueos)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 120
limit_time_real = 240

; Configuración de Red y Proxy
proxy_mode = True

; Registro y Logs
logfile = False
log_level = info
